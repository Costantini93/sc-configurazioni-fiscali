<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <script>
    // Tema prima del primo disegno, per evitare il lampo chiaro/scuro: light o dark (al primo avvio quello del dispositivo)
    (function () {
      var t; try { t = localStorage.getItem('sc-theme'); } catch (e) {}
      var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('theme-dark');
    })();
  </script>
  <meta name="description" content="Guide passo passo per la configurazione delle stampanti fiscali - SC Sistemi di Cassa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SC Config">
  <title>SC Configurazioni Fiscali</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>

</body>
</html>
